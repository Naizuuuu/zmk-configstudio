manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # --- ADD THIS REMOTE BELOW ---
    - name: zmk-community
      url-base: https://github.com/infused-kim
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
    # --- ADD THIS PROJECT BELOW ---
    - name: zmk-battery-reporter
      remote: zmk-community
      revision: v0.3
  self:
    path: config
